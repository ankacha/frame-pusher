function side(title,dx,dy,build){H0=nodes.length;build();const ns=mine();ns.forEach(n=>{n.x+=dx;n.y+=dy});note(title,Math.min(...ns.map(n=>n.x)),Math.max(...ns.map(n=>n.y))+3.2,{b:1,fs:13});return ns}
function capt(s,d){note(s,Math.min(...nodes.map(n=>n.x)),Math.min(...nodes.map(n=>n.y))-(d||3.4),{fs:12})}
function bm(s1,s2,e,w){const a=nn(0,0,s1),b=nn(3,0),c=nn(6,0,s2),m1=mm(a,b,e),m2=mm(b,c,e);m1.w=m2.w=w;return[a,b,c]}
function pf(sup,ec,eb,w,h,brace){const a=nn(0,0,sup),b=nn(0,3),c=nn(5,3),d=nn(5,0,sup);mm(a,b,ec);const g=mm(b,c,eb);mm(c,d,ec);g.w=w||0;if(h)ld(b,h,0);if(brace)mm(a,c,1,'cable');return[a,b,c,d]}
function ptl(hinge){const a=nn(0,0,'pin'),b=nn(0,3),q1=nn(1.5,3.75),c=nn(3,4.5),q2=nn(4.5,3.75),d=nn(6,3),e=nn(6,0,'pin');mm(a,b);mm(b,q1);mm(q1,c);mm(c,q2);mm(q2,d);mm(d,e);c.hinge=!!hinge;[q1,c,q2].forEach(n=>ld(n,0,-10))}
function arc(s2,hinge){const a=nn(0,0,'pin'),b=nn(6,0,s2),n=split(mm(a,b,1,'beam',.3),.5);n.hinge=!!hinge;ld(n,0,-20)}

/* ===== v2.0: spring and settlement examples ===== */
function UBr(ix){const sv=Object.assign({},secSt);Object.assign(secSt,{mode:'lib',fam:'UB',ix,axis:'strong',E:210,mat:'Steel (S275 / S355)'});const r=secCalc();Object.assign(secSt,sv);return r}
function sbm(xs,s0,ix,w){const r=UBr(ix),ns=xs.map((x,i)=>nn(x,0,i?'none':s0));for(let i=0;i<ns.length-1;i++){const m=mm(ns[i],ns[i+1]);applySec(m,r);m.w=w||0}return ns}
function spr(n,kx,ky,kr){n.spr={x:kx||0,y:ky||0,r:kr||0};return n}
function pfs(base){const m0=members.length,r=pf(base?'rx':'fix',1,1,-15,25),cs=UBr(2),bs=UBr(6);members.slice(m0).forEach((m,i)=>applySec(m,i==1?bs:cs));if(base){spr(r[0],0,40000,15000);spr(r[3],0,40000,15000)}return r}

 o=vtRun(()=>{const{ns,ms}=vtBm([0,a,b,L],['pin','none','none','ry'],s),[A,,,B]=ns;ms[1].w=-w;const r=solve();if(!r.ok)throw Error(vtNo);const at=vtLine(r,ms),xe=vtRoot(x=>at(x).V,a,b),xd=vtMin(x=>at(x).v,0,L);

 h+=d.H('1 Data')+vtData(d,s,'A beam of span '+d.I('L = '+L+vU('m'))+', pinned at A and on a roller at B, carries '+d.I('w = '+w+vU('kN/m'))+' over a length '+d.I('c = '+(b-a)+vU('m'))+' from '+d.I('x = a = '+a+vU('m'))+' to '+d.I('x = b = '+b+vU('m'))+'.');
 h+=d.H('2 Reactions')+d.P('The load has the resultant '+d.I('W = wc')+' acting at the middle of the loaded length, '+d.I('d = a + c/2')+' from A. Moments about B and about A give')+d.E('R_A = @frac{W(L - d)}{L} @qquad R_B = @frac{Wd}{L}','R');
 h+=d.H('3 Maximum bending moment')+d.P('The shear '+d.I('V = R_A - w(x - a)')+' falls to zero inside the loaded length, where the moment is greatest:')+d.E('x_0 = a + @frac{R_A}{w} @qquad M_@rm{max} = R_A x_0 - @frac{w(x_0 - a)^2}{2}','M');
 h+=d.H('4 Deflected shape (Macaulay’s method)')+d.P('A load that stops at '+d.I('b')+' is written as a uniform load starting at '+d.I('a')+' minus an equal uniform load starting at '+d.I('b')+'. Each square bracket is a Macaulay bracket, taken as zero when its contents are negative:')+d.E('EI@frac{@rm{d}^2v}{@rm{d}x^2} = R_A x - @frac{w[x - a]^2}{2} + @frac{w[x - b]^2}{2}');
 h+=d.P('Integrating twice, with '+d.I('v(0) = 0')+':')+d.E('EI v = @frac{R_A x^3}{6} - @frac{w[x - a]^4}{24} + @frac{w[x - b]^4}{24} + C_1 x','v')+d.P('and '+d.I('v(L) = 0')+' fixes the slope constant, which is '+d.I('EI')+' times the rotation at A:')+d.E('C_1 = -@frac{1}{L}(@frac{R_A L^3}{6} - @frac{w(L - a)^4}{24} + @frac{w(L - b)^4}{24})','c1');

/* ---- NB5: simply supported, triangular (variable) load ---- */

 const d=vtDocK();let h=vtHead('Simply supported beam with a triangular load',o)+vtFig(vtBeamSVG(L,{sup:[[0,'pin'],[L,'roller']],wv:vtWL(w)}),'Figure 1. A load rising linearly from zero at A to w at B (a variable UDL).');
 h+=d.H('1 Data')+vtData(d,s,'A beam of span '+d.I('L = '+L+vU('m'))+', pinned at A and on a roller at B, carries a load that rises linearly from zero at A to '+d.I('w = '+w+vU('kN/m'))+' at B, as from water or soil pressure. The intensity at '+d.I('x')+' is '+d.I('q(x) = wx/L')+'.');

 h+=d.H('3 Deflections')+d.P('Span AB is a simple span under the uniform load and a hogging end moment '+d.I('|M_B|')+' at B. Superposing the two:')+d.E('v(x) = -@frac{wx(L^3 - 2Lx^2 + x^3)}{24EI} + @frac{|M_B|x(L^2 - x^2)}{6EIL} @qquad (0 @le x @le L)','v')+d.E("@theta_B = v'(L) = @frac{1}{EI}(@frac{wL^3}{24} - @frac{|M_B|L}{3})",'th');

 const d=vtDocK();let h=vtHead('Encastré beam with an offset point load',o)+vtFig(vtBeamSVG(L,{sup:[[0,'fix'],[L,'fix']],P:[[a,vtPL('P',P)]],lab:[[0,'A'],[a,'C'],[L,'B']],dims:[[0,a,'a = '+a+' m'],[a,L,'b = '+b+' m']]}),'Figure 1. Beam built in at both ends with a point load nearer B.');
 h+=d.H('1 Data')+vtData(d,s,'A beam of span '+d.I('L = '+L+vU('m'))+' is built in (encastré) at both ends A and B. A point load '+d.I('P = '+P+vU('kN'))+' acts at C, '+d.I('a = '+a+vU('m'))+' from A and '+d.I('b = '+b+vU('m'))+' from B. The beam is statically indeterminate to the second degree for vertical loads.');

/* ---- NB8: encastre beam, UDL ---- */

function showMethod(){showV('Method & assumptions','<ul><li>Linear-elastic 2D frame analysis by the direct stiffness method (Euler–Bernoulli beam elements, 3 DOF per node), small displacements.</li><li>EI = E·I and EA = E·A come from the member section and material (library, shape calculator or direct entry). Members without a section are generic reference members: EI = 10 000 kNm² and EA = 1 000 000 kN (close to a UB 254×146×31 in bending), times the stiffness multiplier (×0.1 to ×30). Deflections are therefore real values, and in the examples they stay small compared with the span (span/180 or stiffer), as the small-displacement Euler–Bernoulli theory assumes.</li><li>Curved members are split into 10 straight beam segments along a circular arc; a distributed load acts normal to the member, or in global Y or X, per metre of true length or of projection, as chosen in the UDL options (v2.6). A global load on a sloping segment is resolved into a transverse part, with the usual fixed-end actions, and an axial part, whose consistent nodal loads are L(2p₁ + p₂)/6 and L(p₁ + 2p₂)/6; the axial force then varies linearly or quadratically along the element. Optional self-weight adds A·γ per metre of true length in global −Y to every member with a section.</li><li>Tapered and haunched members (v2.9): the section varies along the member, either linearly from end A to end B (taper) or over a haunch at either end. For a section with plate dimensions the ends are given as sections of the same type (a library size or plate dimensions, v2.9.1), each dimension varies linearly between them, and the area, inertia and extreme-fibre distance are recomputed from the dimensions at every point; otherwise I ∝ d² (I-section), d³ (solid, constant width) or b (width varies). The member is analysed as prismatic elements (32 along a taper, at least 8 along each haunch), each with the exact mean flexibility of its length, EI = 1 / mean(1/EI) and EA = 1 / mean(1/EA), exact for constant moment and axial force and converging as the square of the element length otherwise. Self-weight follows the area and stresses use the section at each point.</li><li>Member end releases (v2.10): a released member end is moment-free. It is given its own rotation degree of freedom, so it can rotate independently of the node, while the members still connected at that node share the node’s rotation. A hinge at a node releases every member end there. With n members at a joint, releasing n − 1 of them is the same as a hinge; a moment, rotational spring or fixed support at a node where every member end is released has nothing to act on, and the Diagnostics say so. Cables are released at both ends by nature.</li><li>Cables carry tension only: members found in compression are removed and the model re-solved until the set stabilises (up to 20 passes).</li><li>Reactions are R = K·u − F; bending moment is sagging-positive, shown on the tension side; deflections and diagram sizes are scaled for display only and softly saturate.</li><li>Equations are solved by symmetric Gaussian elimination (K = L·D·Lᵀ) without row exchanges, since K<sub>ff</sub> is symmetric positive-definite; a pivot below 1e-11 of its own original diagonal is declared a mechanism.</li><li>The Matrix diagnostics panel reports symmetry, rigid-body, pivot, condition-number, backward-error, energy and equilibrium checks, each with its calculation.</li><li>Spring supports (vertical, horizontal or rotational) add their stiffness k to the diagonal of K at that degree of freedom, so the node is free to move and the spring force is F = k·δ; the settlement is δ = F / k. A spring on a direction that is rigidly restrained is ignored. An imposed support settlement is a prescribed displacement: its columns of K are moved to the right-hand side (K<sub>ff</sub>u<sub>f</sub> = F<sub>f</sub> − K<sub>fs</sub>u<sub>s</sub>) and the support force is recovered as R = K·u − F. Spring forces are included in the global equilibrium and work-balance checks.</li><li>Loads are in kN, kN/m and kNm, lengths in m.</li></ul>')}

const CHANGELOG=[
['2.15','Workings',['Integration chain in the member inspector: for a straight member, five stacked plots along its length – load q, shear V, moment M, slope θ and deflection w – each the integral of the one above (the slope is the integral of M/EI), with the relation both ways (V = V(0) + ∫q dx, q = dV/dx), the values at each end, the constants of integration at end A and a table checking each step: ∫q dx = V(B) − V(A), ∫V dx = M(B) − M(A), ∫M/EI dx = θ(B) − θ(A) and ∫θ dx = w(B) − w(A). Tapered members are included; cables and curved members say why they are not.','Strain energy: a Strain energy section in the Info panel gives the energy stored in the structure, U = Σ∫M²/2EI dx + Σ∫N²/2EA dx + ΣF²/2k, split into bending, axial and springs, checked against the work done by the loads (½ΣP·δ, including distributed loads and imposed settlements), and lists the members that store the most with their share and how much of it is bending. Energy in the bottom bar colours every member by its energy per metre, from blue (little) to red (most), and labels the three biggest shares.','Degree of indeterminacy: a new Info panel section says whether the structure is statically determinate or indeterminate and to what degree, with the count behind it: s = b + r + kₛ − e (+ m), member force components, reactions and spring forces against the equilibrium equations, plus the number of mechanisms. It also gives the kinematic degree, the number of unknown displacements the stiffness method solves for, and says when the canvas holds several separate structures.','Solve step by step: ⇶ Solve steps in the top bar opens a panel that rebuilds the solution from the stiffness matrix in six stages – the assembled K and F; the supports, listing every fixed DOF and why, and the partitioned K_ff with the settlement term K_fs·u_s; symmetric elimination pivot by pivot, with each pivot, its share of the original diagonal, the multipliers and the matrix as the zeros appear below the diagonal; forward and back substitution, with each displacement’s equation and numbers; the reactions R = K u − F and their sums; and each element’s end forces f = k T u − f_e, with every vector and matrix. A slider, ◂ ▸ (or the arrow keys) and Play step through the elimination, the substitution and the elements. Numbers are printed up to 14 DOFs; larger matrices are shown as coloured cells with the values on hover; models over 80 free DOFs show the first two stages only.','Unit-load method in the node inspector: choose δx, δy or θ and the panel works out that displacement by virtual work, δ = Σ∫Mm/EI dx + Σ∫Nn/EA dx + ΣFf/k − ΣrΔ, member by member, with springs and imposed settlements, and compares it with the stiffness solution. The unit load and its moment diagram m are drawn on the canvas.','The canvas toolbar stays inside the canvas when the inspector panel narrows it.','Verification: 47 new tests (the integration chain against closed form and closed for every straight member of every example; strain energy against w²L⁵/240EI, P²L³/6EI, P²L/2EA and F²/2k, and equal to the work done by the loads in every loaded example; the degree of indeterminacy of beams, frames, arches, trusses, a Vierendeel girder, springs and mechanisms; the solve stepper’s own displacements, reactions and member forces against the solver, and its pivots against det K_ff; the unit-load method against 5wL⁴/384EI and wL³/24EI and against the stiffness solution at every free DOF of every example), 505 in all.']],
['2.14','Mechanism',['Mechanism mode: when a structure is unstable it no longer just says so – the canvas plays the way it can move, a rocking dashed amber shape with the most-moving node marked by arrows, drawn with the same shape functions as the deflected shape. These are the mechanisms of the structure: every independent movement in which no member bends or stretches, found as the null space of the stiffness matrix (symmetric elimination of the diagonally scaled K, skipping the zero pivots). A panel at the top of the canvas says how many there are, steps through them with ◂ ▸, names the node that moves most and in which direction, and hides the shape; the Info panel explains what to add. Slack cables count: a guy that goes slack shows the mast falling over. The motion stops if the system asks for reduced motion.','Snapshot: ◫ Snapshot in the canvas toolbar pins the current results as a ghost. Change anything – a support, a section, a load, the geometry – and the old deflected shape (grey dotted) and the ticked moment, shear and axial diagrams (violet dashed) stay on the canvas, drawn to the same scale as the live diagrams so the two can be compared directly (reduced, and said so, only if the ghost would run off the canvas). The undeformed members of the snapshot are shown too if the geometry has changed. The Info panel gets a table of peak deflection, maximum moment, shear and axial force and the largest reaction, then and now, with the change in per cent. Ghost hides it, ◫ Retake replaces it, ✕ clears it; loading an example clears it.','Mechanisms: a new group of seven examples, each with a caption – a beam on two rollers, reactions that all pass through one point, a hinge in a simply supported beam, a portal frame with four hinges, a truss with one diagonal missing, a guyed pole whose cable goes slack, and two bars in a straight line (an infinitesimal mechanism).','Remarkable structures: a new group of four – a funicular (parabolic) arch against a circular arch under the same loads (0.24 against 13.6 kNm), a Bollman truss, a balanced cantilever bridge on the Forth Bridge principle, and a sailing mast with spreaders and shrouds. All eleven are in the drop-down and the gallery.','Node inspector fix: a joint where every force is zero (a spreader tip whose wires are both slack) showed round-off as a 1e-4 residual; it now reads as in equilibrium.','The canvas toolbar and the new mechanism panel are centred in the part of the canvas left of the docked Diagram scale and Info panels, so the longer toolbar no longer runs under them.','Verification: 43 new tests (the mechanism of each example against its known movement – a slide, a rotation about the pin, a fold at the hinge, a parallelogram sway – with zero strain energy; three rigid-body modes of an unsupported frame; two independent mechanisms; every mechanism example unstable and every other example stable; snapshot statistics against closed form; the funicular arch thrust wL²/8f, the cantilever bridge moments and the Bollman and mast load paths), 458 in all.']],
['2.13','Nodes',['Node inspector: with the side panel open, select a node to interrogate it like a member. It shows the joint as a free body – its position, support, joint type, springs and settlement; its displacements and the rotation of every member end that meets there (released ends turning on their own); a drawing of the joint with the force each member end, the applied load, the support and any spring puts on it, to scale; a table of those forces in global axes with their sum, which is zero when the joint is in equilibrium; the member end forces in member axes (N, V, M); and, folded away, the node’s own 3 × 3 block of the stiffness matrix with the fixed DOFs greyed. The node popup has a Node inspector tick box, as the member popup has a Member inspector one, and the panel title says which it is showing.','Inspector tab: while the side panel is closed, a ‹ Inspector tab on the right edge of the canvas opens it; the I key opens and closes it. With nothing selected the panel asks for a member or a node.','Theme: the Theme button has moved from the canvas toolbar to the right-hand end of the top bar, as a sun (switch to light) or moon (switch to dark) icon, and the choice is now remembered in this browser.','Surprising behaviour: a new group of nine examples, each a side-by-side comparison with a caption explaining the surprise – a stiffer beam suffers more from settlement, loading one span lifts the next and pulls on the far support, less load gives more moment (pattern loading), adding a load at the tip of an overhang reduces the deflection, hinges at the points of contraflexure change nothing, a vertical load makes a frame with unequal columns sway, the short column takes almost all the sway, members that carry nothing but are still needed, and the flatter the cable, the harder it pulls. They are in the drop-down and the gallery.','Verification: 43 new tests (joint equilibrium of every node of every example, end shears, spring forces, released ends, hinges and cable joints against closed form, the node stiffness block, each surprising example against its closed-form result, the theme button and the tab), 415 in all.']],
['2.12','Clear',['Point loads: the arrow grows in proportion up to 90 px (3 kN at Diagram scale 1) and only slowly beyond, so a large load no longer draws a line across the whole canvas; the label still gives the true value, and the load is picked along the arrow as drawn.','Labels control in the bottom bar: All, Key values (the default) or None. Every value on the canvas now goes through one placement pass, in priority order (reactions, loads, bending moments, settlement and spring movement, shear and cable force, axial force, spring stiffness, section names): a label that would overlap another tries above, below and beside its point, with a faint leader when it moves; one that still overlaps is left out in Key values if it is a minor one, and kept in All. The δmax labels avoid them too. None hides the values and keeps the section names (they have their own tick box). The choice is remembered in this browser.','Spring supports are one compound symbol: each spring is drawn from its ground anchor to the displaced node (it leans and stretches with the deflected shape, so the v2.11 dashed spring ghost is gone), a rigid restraint in the other direction is a pinned link to a wall or the ground instead of a roller drawn over the spring, and a rotational spring is a small coil whose rotation pointer shows in All mode or when the node is selected. Each spring has one label block (δ and F, δx and Fx, θ and M), only the key springs are labelled – per structure the largest and smallest movement and the two outermost, or all of them if there are three or fewer, in All mode, or when selected or hovered – and a stiffness shared by more than three springs of a structure is given once (k 3,000 · 11 springs). Moving rigid supports are still ghosted, more faintly and only when they move at least 3 px.','Section names are given once for a straight run of members with the same section (a beam split into 12 elements shows one UB label at its middle), and a name longer than its member is left out in Key values.','Report: the deflection, bending moment, shear, axial force and reaction figures show each support as a small grey marker (triangle, bar or small spring); Figure 1 and the loading diagram keep the full symbols.','Report: diagrams are no deeper than 30 % of the median member length and stay within half the gap between separate structures, so a head-to-head diagram no longer runs into its neighbour; axial force is a thin band at most 2.4 mm wide.','Report: the reactions figure gives each supported node one block of values (Rx, Ry, M, with (spr) for the part a spring carries), placed clear of the arrows, the moment arcs and the other blocks, with a leader when it has to move away.','Report: the Output column beside the reactions figure now gives the total vertical reaction at each supported node, spring force included and marked (spring); it showed 0.00 kN at a node on a vertical spring.','Report preview: text is drawn to the exact PDF (Helvetica) widths, so a paragraph can no longer run into the Output column when the browser substitutes a wider font.','Verification: 21 new tests (arrow length, label placement, priority and the three Labels modes, section-name runs, key springs, compound spring symbols, report diagram size, reaction labels and the Output column, preview text widths), 372 in all.']],
['2.11','Ghost',['Moving supports are ghosted with the deflected shape: when the deflected shape is shown, every support that moves (a roller sliding along its track, a pin or roller on a spring, a fixed support turning on a rotational spring) is drawn again as a dashed outline at its displaced position, in the deflection colour, so you can see where the support has gone. A spring is ghosted too, dashed from its ground anchor to the displaced node, so it leans and stretches with the deflected shape (the solid spring still shows the compression in its own direction). The ghosts follow the deflection scale and the Animate playback.','Initial structure toggle in the bottom bar: untick it to hide the undeformed members, their section labels and the node dots, leaving the supports, loads and results (deflected shape, diagrams, reactions) on their own. Members can still be picked: hovering or selecting one highlights it.','An unstable structure is now hard to miss: the warning in the Info panel and on the collapsed Info panel button is red, with a throbbing ⚠ icon (the throb stops if the system asks for reduced motion).','Home button (⌂) at the left of the top bar, before the Frame Pusher title, returns to ankacha.github.io (in a new tab when Frame Pusher is running inside another page). The model is autosaved in the browser as before.','README updated for v2.11 (now README.md).']],
['2.10','Releases',['Member end releases: each end of a member can now be released (moment-free) on its own, so a joint can be partly pinned. A beam can run continuously over a column with a simple connection, a truss can have continuous chords with pinned webs, and a pinned brace or prop can frame into a rigid portal. A hinge at a node is still there: it releases every member end at the node at once.','Left panel: a new End release tool (Q) under Joints & stiffness, after Hinge. Click a member near one of its ends to release that end or to fix it again; the nearer end is previewed as you hover. Clicking an end at a hinged node fixes that end only and leaves the others released. The Rigid joint tool, and Rigid in the node popup, fix every member end at the node, and the node popup says how many member ends are released there.','Member inspector: each end row has a tick box, Release the moment at end A / B, and says whether the end is released, rigidly joined, or released by a hinge at the node, how many other members are still rigidly connected there, and when a fixed support acts as a pin for the member. The member drawing shows the release.','Drawing: a released end is a small open circle just inside the member, on the canvas, in the example gallery and in the report, and the report lists the released ends after the members table.','Analysis: an end is released when its own flag is set or its node is a hinge, and a released end has its own rotation degree of freedom, as hinges had. The node keeps its own rotation only while at least one moment-carrying member end there is still connected, so releasing n − 1 of the n ends at a joint gives exactly the hinge result. Two inconsistencies of the hinge model are fixed: a moment applied at a hinged node used to go into whichever member was drawn first, and is now reported in the Diagnostics as having nothing to act on (as is a rotational spring there); and a fixed support at a node where every member end is released is now noted as acting as a pin. A mechanism caused by releases names the member and end, and the stiffness-matrix panel labels each released end rotation by its member and end (m3 θB).','Releases are kept by save / open (member field 11; earlier files open with none), undo, copy and paste, split (the outer releases stay with their ends, the new joint is rigid) and join (refused where an inner end is released; the outer releases carry over).','Two new head-to-head examples: a beam over a column with a rigid and a pinned connection, and a truss with pinned joints against one with continuous chords and webs released at both ends.','Verification: 38 new tests (propped cantilever and simply supported beam made by releasing fixed ends against closed form, n − 1 releases against a hinge, a moment at a partly and a fully released joint, a rotational spring at a released node, a mechanism, split, join, save / open, copy and paste, hinge-to-release conversion and the two examples), 342 in all.']],
['2.9.1','Inspector',['Member inspector (the side panel, opened from the member popup): it now starts with the member itself, drawn in its true orientation with its depth profile, its end conditions (support, spring, settlement, hinge or rigid joint, and dashed stubs for the members that continue from each end) and every load on it or on its end nodes, with A and B marked. A written list below gives each end’s node, coordinates and condition and each load with its direction and resultant. The results follow under Results along the member.','Section & profile editor in the inspector: set the member’s section directly – reference member × multiplier, British Standard library (series and size), shape calculator (shape and dimensions) or EI and EA – with material, E, fy and bending axis. Changes apply live to this member and can be undone; ▤ Sections & materials still sets several members at once.','Tapered and haunched members can now have a full section at each end, not only a depth: a taper runs from the member’s own section at A to a library size or set of plate dimensions of the same type at B (for example UB 457×191×67 to UB 305×165×40), with every plate varying linearly; a haunch runs from its end section to the member’s section over its length. Uniform, Tapered and Haunched are chosen at the top of the editor, ⇄ swaps the ends, and each end shows its A, I and EI. Generic members keep the depth ratio and section law.','Profiles saved by v2.9 (depth ratios) open unchanged and are shown as end sections when edited; if the member’s section changes type (an I-section to a hollow section, or to a generic member) its ends are converted to keep the same depth ratios. The member popup now shows the profile and a button to the inspector.','Verification: 12 new tests (a taper between two library sizes against direct integration, haunches given as end sections against the compatibility integral, re-expressing a v2.9 profile, changing the section type, splitting an end-section taper, and drawing every member of every example), 304 in all.']],
['2.9','Taper',['Tapered and haunched members: select a member and choose its profile under Section along member – Uniform, Tapered (a depth at each end, varying linearly between) or Haunched (a haunch of chosen length and end depth at either or both ends, prismatic in between). ⇄ Swap ends turns the profile round. The member is drawn with its depth, so the taper or haunch can be seen on the canvas, and its label says tapered or haunched.','Sections from the library or the shape calculator keep their plate dimensions, so the depth is given in mm and the area, inertia and extreme-fibre distance are recomputed exactly at every point with the flanges and walls unchanged (a web-tapered or haunched fabricated member). Generic members and sections entered as EI and EA use a depth ratio with a choice of law: I-section (I ∝ d²), solid of constant width (I ∝ d³) or constant depth with the width varying (I ∝ b). Sections applied before v2.9 have no dimensions: re-apply them to use the exact geometry.','Analysis: each non-prismatic member is divided into prismatic elements (32 along a taper, at least 8 along each haunch, fewer where it is prismatic), each given the exact mean flexibility of its length, EI = 1 / mean(1/EI) and EA = 1 / mean(1/EA) by Gauss quadrature. This is exact for constant moment and axial force and converges as the square of the element length otherwise (within 0.1 % on the verification tests). The member popup gives EI at both ends and the middle and the number of elements; the stiffness-matrix panel shows each element’s own EI.','Self-weight follows the area along the member, member stresses and utilisation use the section at each point, and splitting a tapered or haunched member gives each part its share of the profile. Copy and paste, undo and save / load keep the profile; a node between tapered members is not joined.','Report: a note after the members table describes each tapered or haunched member with its EI at both ends.','Three new examples: a tapered cantilever (web-tapered UB), a haunched portal frame, and a head-to-head of a portal with a prismatic and a haunched beam.','Verification: 22 new tests against direct numerical integration of the virtual-work and compatibility integrals (tapered cantilever deflection and rotation, simply supported deflection, the end moment of a haunched fixed-ended beam, a tapered tie, the geometry, deflection, stress and self-weight of a web-tapered UB) and of split, save / load and joining, 292 in all.']],
['2.8.1','Join',['Removing a node that sits between two members in a straight line now joins them into one continuous member from end to end, instead of deleting both members, so there is nothing to redraw. It works with Delete or Backspace on a selected node, and on several nodes at once: a whole row of in-line nodes collapses to one member.','The join is made only when it changes nothing else: both members straight and of the same kind (beam or cable), with the same section and stiffness, and distributed loads that together make one uniform or straight-line varying load in the same direction and on the same length basis (a normal load on a member drawn the other way round is turned to match). Otherwise the node is kept and a message says why, for example a UDL on only one of the two members.','Anything on the node itself (support, spring, settlement, hinge, point load or moment) is removed with it, as before, and the message says so. Nodes at corners or with three or more members are deleted with their members as before. Undo restores the original members.','Verification: 21 new tests, 270 in all (a split beam under UDL, a reversed member with a normal load, a triangular load over two members and a sloping rafter under plan load each give the same results once joined; cases that must not join; a row of nodes deleted together, and undo).']],
['2.8','Files',['Save / open (top bar) now saves the model as a file: name it and press Save to file to download a .json file holding the whole model (nodes, members, supports, springs, settlements, loads with their direction, sections, annotations and self-weight), with the app version, date and name. Choose a file… or drop a file on the dialogue to open one; a file dropped anywhere on the app opens too. Ctrl+S saves and Ctrl+O opens without the dialogue.','Opening a file replaces the structure on the canvas and can be undone. A file that is not a Frame Pusher model, or is damaged, is refused with a message and the canvas is left as it was. Text copied from the old Save / load box still opens, from a file or from the text box.','The copy-and-paste text box is still there, folded away under “Copy or paste as text”.','Welcome guide: Browse examples now opens the example gallery instead of the drop-down list.']],
['2.7','Example gallery',['Gallery: a button beside the Example structures drop-down opens every example as a card, in a panel over the app styled like the welcome guide (close it with ✕, Esc or a click outside). Each card has a diagram drawn from the example itself, a short description of what it shows, tags (nodes, members, hinges, cables, springs, settlement, steel sections, loaded or not) and an Open on canvas button.','The diagrams use the canvas conventions: line weight follows member stiffness, cables are dashed, hinges are open circles, and pins, rollers, fixed walls, springs, imposed settlements, point loads, moments and distributed loads (in their own direction and shape) are drawn as on the canvas.','Cards are grouped and ordered as in the drop-down, with filter buttons for each group and a search box (/ to focus it, Esc to clear it or close the gallery). Opening an example over a structure asks for confirmation on the card itself, then closes the gallery.','Building the cards never touches the structure on the canvas or its undo history.']],
['2.6','Load direction',['Distributed loads can now act normal to the member (as before), in global Y (vertical) or in global X (horizontal). Global loads can be measured per metre of true length (self-weight, cladding) or per metre of projection: plan length for vertical loads (snow, imposed roof load) or height for horizontal loads (wind). Gravity on a sloping or curved member is now modelled correctly.','A Distributed load panel opens beside the tool bar with the UDL and Var. UDL tools, like the Spring, Stiffness, Curved and Split panels: choose the direction, the length basis, and either Drag to set (drag along the load direction) or Fixed value (type w, or w start and w end, and click members to apply it). The cursor chip follows the choice. Selecting a load shows its direction and basis, which can be changed, and its resultant force.','Analysis: a global load on each sloping element is resolved into a transverse part, with the usual fixed-end actions, and an axial part, with consistent nodal loads L(2p₁ + p₂)/6 and L(p₁ + 2p₂)/6. The axial force now varies along a member that carries an axial load, and the axial diagram, member popup, side panel, stresses, report end forces and equilibrium checks all use the varying value. Axial displacement along the member includes the exact particular solution.','Self-weight (optional, in the same panel): adds A × γ per metre of true length in global −Y to every member with a section, on top of its own distributed load. γ is taken from the section’s material (steel 77.0, stainless 77.5, aluminium 26.5, concrete 25.0, timber C24 4.1 kN/m³) or set as a custom value; generic members without a section carry none. It is drawn as small grey ticks, saved with the model and undoable, and starts off for a new example or a cleared canvas.','Report: the member load schedule gives each load’s direction and basis, a Self-weight table lists A, γ and totals when it is on, the loading diagram draws arrows in the true direction, and the applied-load resultant includes both.','Verification: 23 new tests (an inclined beam under vertical load per plan length, per true length and normal; a column under horizontal load; a curved member under plan load; self-weight of a column and a beam; split and save / load), 249 in all, and a new worked example, Inclined beam, comparing the three loadings with closed-form results.','Splitting, copying, pasting, undo and save / load all keep the load direction and basis; text saved by earlier versions loads with normal loads, as before.']],
['2.5','Guide',['Welcome guide: an illustrated quick guide opens when Frame Pusher starts, in six steps (draw the structure, support it, push and pull it, watch the response, select and interrogate, learn and check), each with a small drawing and the keys to use, plus a strip of navigation keys (zoom, pan, fit, Esc, undo, delete).','The guide can be reopened at any time with ? Guide in the top bar. Untick “Show this guide when Frame Pusher opens” to stop it appearing on start-up; the choice is remembered in this browser.','Start drawing closes the guide and picks the Member tool; Browse examples closes it and opens the example list. Esc, ✕ or a click outside the guide also closes it, and drawing keys are ignored while it is open.']],
['2.4','Modules',['Source reorganised for maintenance: the code now lives in separate modules (setup, matrix inspector, annotations, presets, interaction, tests, verification engine and examples, help, changelog, solver, rendering, report, start-up) and five style sheets, which a build step combines into this one self-contained page. Nothing in the analysis, results or interface has changed, and the page still runs on its own as a single HTML file that can be saved and shared.','The version shown in the top bar now reads v2.4 (it had been left at v2.3), and the build checks that it matches the version in About so they cannot drift apart again.']],
['2.3','Report',['Report / export: a ⎙ Report button in the top bar opens a dialogue in its own window (or full-screen in the page if the browser blocks new windows) that produces A4 calculation sheets of the current model as a PDF. The left side holds the sheet details and the choice of contents; the right side is a live preview of every sheet, which follows changes made in the main window.','Calculation-sheet layout: each sheet has a title block with company name and address, project, subject, job number, revision, calculated-by and checked-by initials with dates, and automatic sheet numbering (“3 of 8”) from a chosen first sheet number and optional prefix. The body has the traditional Ref. / Calculations / Output columns: section, figure and table references sit in the left margin and the key results of each section (peak moment, shear, axial force, deflection, reactions, equilibrium) are carried into the Output column. The date defaults to today; the other details are remembered in this browser.','Contents to choose from: the structural model (dimensioned drawing with node and member numbers, node / support / spring table and member properties table), the loading diagram with nodal, member and settlement load schedules, the deflected shape with a nodal displacement table, bending moment, shear force and axial force diagrams with peak and member-end values, support reactions with spring forces and a global equilibrium check, a member results summary, member end forces, the analysis method with solver diagnostics, and free-text notes.','Diagram options: colour or black and white, compact / standard / large figures, 1 to 3 decimal places, value labels and node / member numbers on or off, and an automatic or fixed deflection magnification. Diagrams are redrawn as vector line work for print rather than captured from the screen, with labels kept clear of one another.','Download PDF writes a vector PDF directly in the browser (standard Helvetica fonts, no external libraries), exactly matching the preview; Print sends the same sheets to the browser’s print dialogue at A4 with no margins.']],
['2.2','Leader',['Example structures reordered from simple to complex: beams and frames, springs and settlement, trusses, then cables and bridges, with every Head to head comparison (including the two ground and base-spring comparisons) grouped at the bottom.','Deflected shape scaling: the magnification is now held steady while you drag a settlement, load or node, so the shape grows, shrinks and reverses in proportion to the displacement instead of jumping between full-size up and full-size down (most noticeable with small settlements either side of zero). During a drag it only shrinks if the shape would grow past about 220 px; when the drag ends, or after any other change, it eases to the auto-fit size over a fraction of a second rather than snapping. Springs, settlement markers and the δmax label follow the same scale.','Hover highlight: the node or member the current tool would act on is picked out in cyan under the cursor (a glow and outline along a member, a ring and halo round a node), only when the tool can actually be applied there. Stiffness, Split, UDL and Var. UDL highlight members; supports, Spring, Settle, joints, Member and Cable highlight nodes; Select, Point load, Moment, Node and Curved highlight whichever is nearest.','Animate speed: while the animation runs, a pop-up above the button holds a slider to set the speed from ¼× to 4× (1× is about 1.8 s per cycle); it hides again when the animation stops.','Animate: a button at the start of the bottom bar plays the response growing smoothly from zero to its full value and back, on a loop, as if the load were applied and removed. The deflected shape, bending moment, shear and axial diagrams and the reaction arrows all animate (those that are ticked); the δ M V N R toggles in the pop-up above the button choose which ones move, and the value labels keep showing the full results. It stays live while you edit or drag loads; ■ Stop returns to the static view.','Tool options open in a panel beside the tool bar: choosing Spring, Stiffness, Curved or Split element (by button or key) shows its settings to the right of the bar, with a ✕ to hide it while keeping the tool. The tool buttons stay a uniform size.','Keep loads on release moved from the bottom bar to the floating canvas toolbar.','Cursor pills: short wording for every tool, wrapping onto a second line when needed and capped at about 260 px wide. Hints that still referred to the old slider and sidebar positions now point to the new panels.','Roller supports: the two wheels are drawn as separate circles (a stray line used to join them through the symbol).','Fixed supports are drawn as a wall: a thick line through the node with diagonal hatching on the restrained side, set on the side away from the members it holds (below a column base, beside a cantilever root). The Fixed tool icon matches.','Selection popup: placed where it covers least of the frame (members, supports, loads, diagrams, labels, annotations and the floating panels, with the selected element weighted most heavily), and joined to the selected node or member by a leader line. Its height is capped at about half the canvas, scrolling if longer.','The popup position is chosen when a node, member or annotation is selected, and only changes again if the structure’s geometry changes. Hovering, mouse movement, zooming, panning and resizing the window do not move it; the leader follows the element instead.','Annotations (text, boxes, ellipses, lines, arrows and dimensions) now scale with the zoom: text size, line weight, arrowheads and padding are relative to the zoom they were drawn at, so they shrink with the structure when zoomed out instead of covering members (down to a 6 px minimum).']],
['2.1','Closed Form Verification',['Verification tests now sit in a tabbed panel that can be moved into its own window (⧉ New window, and ⇲ Dock to bring it back), in the same way as the stiffness matrix. ↻ Run again re-solves every test.','Sixteen worked examples, each built and solved in the live analysis engine and compared with a closed-form hand solution set out as numbered textbook equations, with the numbers substituted, a comparison table and, where useful, a deflection plot. Beams: simply supported (UDL), cantilever (tip load), propped cantilever (UDL, force method). Frames: pinned-base portal, fixed-base portal under gravity and fixed-base portal under a horizontal load (sway), by slope-deflection. Cables: a hanging two-segment cable and a cable-stayed cantilever. Supports: a beam on a mid-span spring and a two-span beam whose middle support settles. Axial: a hanging stepped cantilever lengthening in tension and shortening in compression. Also a Gerber beam with an internal pin, a three-pinned parabolic arch, a pin-jointed Pratt truss solved by the method of joints with its deflection by virtual work, and a Vierendeel cell. A closed-form value of exactly zero, such as the moment at a pin, is checked absolutely (to 10⁻⁹).','Two existing verification tests (group move, annotation selection) no longer depend on the current zoom of the canvas.','Mathematics audit (same version): the solver was checked against an independent reference implementation (end releases by static condensation, load vectors by Gauss quadrature, deflections by integrating M/EI) on 300 random frames, beams and cable trusses with springs, settlements, hinges, arcs and trapezoidal loads; displacements, reactions, axial forces, moments and deflections agree to 1e-6 or better. Fixes: member maximum M, V and deflection (popup, side panel, Verification) could miss the value at end B, because x = L was sometimes rounded just past L and skipped (a hogging support moment could be under-reported by about 1 %); the maximum shear under a varying load now includes its exact interior peak; diagram peak labels, the Max |M| / |V| readout and the δmax label now use the exact extremes instead of the nearest of 25 samples; a new Diagnostics row reports any load or spring the model cannot carry (a load at a node held only by slack cables, a moment where no member carries moment, a rotational spring at a hinge), which previously vanished silently while still passing the equilibrium check.','Reference stiffness (same version): members without a section were EI = 1 kNm² with EA = 500·EI, so a 6 m beam under 10 kN/m showed 169 m of deflection, far outside the small-displacement assumption of Euler–Bernoulli theory. Generic members are now a real reference member, EI = 10 000 kNm² and EA = 1 000 000 kN (close to a UB 254×146×31), and the stiffness slider is a multiplier on it (×0.1 to ×30). The same beam now deflects 16.9 mm (span/356); every example stays at span/180 or stiffer. Deflections are shown in mm throughout, the head-to-head captions are re-solved with real deflections, and the verification tests that assumed EI = 1 now use the reference member. Text saved before this change is converted on loading (relative EI × 10 000, EA = relative × 1 000 000). The Hager κ₁ test now checks for a lower bound within a factor 10 (it is 3.0 for the cable-stayed test model).','Fourteen more worked examples (same version), making thirty. Beams: simply supported with a central point load, an offset point load, two symmetric point loads, a partial uniform load (Macaulay brackets), a triangular load and an overhang under uniform load; encastré with an offset point load and with a uniform load; a propped cantilever with a point load at the end of an overhang. A new Continuous beams group, by Clapeyron’s three-moment equation: two equal spans fully loaded and with one span loaded (pattern loading), two unequal spans, and three and four equal spans. Each cites the numbered equation it is checked against, and the deflection plots now show uplift as well as sag, with the supports marked.']],
['2.0','Settlement',['Spring supports: a new Spring tool (key 6) puts a vertical, horizontal or rotational spring at any node, with a stiffness in kN/m or kNm/rad and a menu of typical ground stiffnesses. Springs are also editable in the node popup. The spring stiffness is added to the diagonal of the stiffness matrix, so a loaded beam now settles by delta = force / k.','Settlement is drawn: each spring is drawn between the ground and the deformed node, compressing as it is loaded, with a dashed datum at the original level, an arrow and a label giving the settlement, the spring force and k. The Info panel reports the maximum and minimum settlement and the differential settlement. A Settlement tick box in the bottom bar hides the labels.','Imposed settlement: the Settle tool (key S) drags a pinned, roller or fixed support down or up by 1 mm per pixel (also a field in the node popup). The support is a prescribed displacement in the solver, so the beam shows the moments, shears and reactions that settlement alone induces, with a ghost support at the settled level.','Six new examples under Springs and settlement: a beam on three springs, soft vs firm vs stiff ground, tilt of a stiff beam under an eccentric load, a continuous beam whose middle support sinks, a beam on an elastic foundation (Winkler springs under every node) and a portal frame on fixed vs spring bases.','Spring forces and prescribed displacements are included in the equilibrium and work-balance diagnostics, in the stiffness-matrix heatmap and its cell derivations, in save / load, copy / paste and undo. Verification suite extended with closed-form spring and settlement checks.','Fixed an error inherited from v1.16: the axial stiffness EA of library and calculated sections was 1000 times too small (E x A x 10^-3 instead of E x A, with E in GPa and A in mm2), so axial shortening and truss elongation were hugely exaggerated whenever a real section was applied. EI was always correct. Text saved from an older version keeps the EA it was saved with: re-apply the section to refresh it.','Major version: v2.0 is a separate artifact so that v1.26 keeps its original behaviour.']],
['1.26','Layout',['Info panel and Diagram scale now dock in one column at the right of the canvas, start collapsed, and Fit view leaves room for them when open, so they no longer cover the structure or captions.','Peak-deflection labels are drawn on top as pills with a background and leader line, placed automatically away from loads and reactions.','Navigation de-duplicated: the version moved to the top bar, Matrix diagnostics now lives only in the Info panel, and the sidebar header and hint panel were removed.','New floating canvas toolbar (Undo, Redo, Fit, Duplicate, Clear loads, Theme); the bottom bar now only holds display toggles. Redo added (Ctrl+Y or Ctrl+Shift+Z).','A chip beside the cursor shows the active tool, a one-line hint and how to exit it.','Diagrams are distinguished by line style as well as colour: moment solid, shear dash-dot, axial dotted, deflection dashed, reactions dashed arrows.']],
['1.25','Group',['Annotations can now be selected with the box (marquee) select, Select all and Shift-click, alongside nodes and members; the selection shows how many of each are chosen.','Drag any item that is part of a multi-selection to move the whole group together (nodes with their members, loads and annotations). The move snaps to the grid (hold Alt to move freely) and a plain click without dragging still picks just that item.','Arrow keys nudge annotations and groups; Delete removes selected annotations; Copy / Duplicate now include annotations.','Default annotation style now matches the neon UI: text notes are glowing violet-edged panels with a magenta accent bar, and lines, arrows, boxes, ellipses and dimensions default to neon cyan with a soft glow. Colour “Auto” and Fill “Auto / None” restore or remove the defaults.']],
['1.24','Neon',['Fixed the u, F and R vector strips in the stiffness-matrix inspector: v1.23 gave the matrix a scroll box painted in the same colour as the zero cells, which hid the cell structure of the strips. The box now only appears (with a thin outline) when you zoom in.','Cyberpunk restyle: deep indigo-black surfaces with neon violet, magenta and cyan accents, glowing borders and focus rings, gradient toolbar and active buttons, spaced uppercase headings. A matching light theme keeps the same accents on lavender.','Matrix colour scales are now neon (magenta for positive, cyan for negative) and adapt to the light and dark themes; they also refresh when you toggle the theme.','Diagram colours brightened to suit the new palette (moment, shear, axial, reactions, loads, deflection).']],
['1.23','Matrix lens',['Peak deflection is now labelled on the canvas (marker, value, x/y components and the drawing magnification), one label for each separate structure, so head-to-head examples show a peak for every structure.','Stiffness matrix zoom: + / − / Fit / Read buttons, Ctrl or ⌘ + wheel (or plain wheel when nothing scrolls), scroll bars, and a Read button that zooms until numbers or equations are legible.','Element stiffness equations: choose “Element equations” or “Value + equations” for the cell text, or hover or click any cell to see the member’s local stiffness matrix (EA/L, 12EI/L³, 6EI/L², 4EI/L, 2EI/L), the rotation to global axes, the global element matrix, and the exact term that feeds the cell with its numbers substituted. Boxes that feed the cell are highlighted.','Click a cell to pin it while reading; the dashed teal shape on the canvas shows the unit displacement that column describes.','Build K member by member: slider, step and play controls show the matrix growing as each member’s element matrix is added, with the latest contribution highlighted.','Explanatory notes on what an entry means, where it comes from, how to check it by hand, and its units. Members that are curved are labelled by segment (m3.1, m3.2).']],
['1.22','Head to head',['Twelve head-to-head examples: several structures on one canvas with identical loads and one thing changed, so the diagrams (drawn to a common scale) can be compared directly. Beam end fixity, stiffness EI x1/x2/x4, continuous beam vs hinge over the support, cantilever with and without a cable stay, portal frame with pinned vs fixed bases under sway and gravity, cable bracing, beam-to-column stiffness ratio, rigid vs three-pinned pitched portal, pinned vs three-pinned vs roller-supported arch, Pratt vs Howe, and Warren vs Vierendeel.','Examples can now carry their own point and distributed loads and titled annotations explaining what to look for.','The example menu is grouped (Head to head, Beams and frames, Trusses and layouts, Cables and bridges).','Fit view now includes annotations.']],
['1.21','Polish',['The matrix panel now shows the displacement vector u and the load vector F beside K (K·u = F), with support reactions R added in the full view, per-row hover read-outs, a separate colour scale for each vector and an equilibrium check.','The matrix can be popped out into its own window (⧉) or maximised over the canvas (⤢).','Interface restyled with one consistent set of surfaces, controls, spacing and typography across the tool panel, top bar, floating panels and dialogs.','Diagram scale sliders now stay inside their box.','Esc cancels the current operation and returns to the Select tool; right-click cancels the current operation and keeps the current tool (right-drag still pans).','The Legend tick box now sits under the legend.']],
['1.20','Matrix',['Stiffness matrix heatmap (▦ Stiffness matrix in the top bar): a live, draggable view of the assembled matrix K that redraws as the structure is edited. Choose the free-DOF matrix K_ff that is actually solved or the full matrix, log-magnitude / linear-signed / non-zero-pattern colouring, assembly or reduced-bandwidth (RCM) ordering, and the size. Cells that changed in the last edit are highlighted, fixed DOFs are washed out in the full view, and values are printed when the cells are large enough.','Hover a cell to see its row and column DOFs, its units, the members that contribute (with each contribution) and the matching nodes and members ringed on the structure. Selecting or hovering a node or member highlights its rows and columns in the matrix. Node and member numbers are shown on the canvas while the panel is open. Statistics: size, non-zeros, density, half-bandwidth, stiffness range and symmetry.']],
['1.19','Annotate',['Undo now restores point, moment and distributed loads as well as the geometry (it previously cleared them), and Clear loads can be undone.','Diagram scale box at the top right of the canvas: independent multipliers for moment, shear, axial, deflection, reactions and loads, plus an all-diagrams slider and reset.','Annotation tools: text notes, boxes, ellipses, lines, arrows and dimensions (aligned, horizontal or vertical, snapping to nodes). Format text size, bold, italic, alignment, colour, fill, border, line width, dash, arrowheads, decimals, units and dimension offset. Annotations live in model coordinates, save with the structure and are undoable.']],
['1.18','Side panel',['Interrogation moved to a collapsible side panel (» collapses it, ✕ closes it): position slider, bending moment, shear, axial force and deflection diagrams along the selected member with a marker, then the shape-function plot and interpolation details.','Further zoom out (down to 1 px per metre) and Shift + box-drag now adds to the current selection.','Twelve new examples: Warren, Pratt, Howe, Fink, cantilever and bowstring trusses, Vierendeel frame, tied arch with cable hangers, queen-post cable-trussed beam, cable-stayed bridge, suspension bridge with stiffening girder and guyed mast. Each is solved and checked for equilibrium in the verification suite.']],['1.17','Interrogate',['Member popup now lists the maximum bending moment, shear, axial force, deflection and extreme-fibre stress with the position of each measured along the member from end A (moment maxima found exactly from the zero of shear).','Utilisation for sectioned members: elastic first-yield check |N|/A + |M|y/I against an editable limit stress fy (set per material in the Section dialog). Indicative only: no buckling, shear or lateral-torsional checks.','Interrogate shape function option in the member popup: slide a point along the member to see the element shape functions N1 to N4 (plot), local end displacements, interpolated v, u, slope, cubic coefficients, M, V, N and stress there, with a marker on the canvas.','Section names are labelled on members (Section labels toggle).']],['1.16','Section',['Member stiffness from real sections: British Standard UB, UC, SHS, RHS and CHS library, shape calculator (I, hollow, solid) and direct EI / EA entry.','Material selection or direct Young\u2019s modulus; EI = E\u00b7I and axial stiffness EA = E\u00b7A replace the generic EA = 500\u00b7EI for sectioned members.','Full-width top menu bar; collapsible info panel sections and legend toggle.']],
['1.15','Diagnostic',['Collapsible Matrix diagnostics panel with traffic-light verdict: symmetry and rigid-body tests of K, pivot and relative-pivot checks, κ\u2081 / κ\u2082 / scaled κ\u2082, digits retained, backward error, refinement correction, work balance and global equilibrium, each with an explanation of its calculation.','Pivot ratio corrected: both pivots are now taken after elimination (v1.14 divided a pre-elimination diagonal by a post-elimination pivot).','Solver now uses symmetric Gaussian elimination without row exchanges; singularity is judged by each DOF\u2019s pivot relative to its own original diagonal, and the offending location is reported.','Verification suite extended with independent element-stiffness, rigid-body, equilibrium, energy and conditioning tests.']],
['1.14','Chronicle',['About section and full changelog added to the Menu.','Version number shown in the sidebar header.']],
['1.13','Workbench',['Two-column sidebar so every tool fits on a 1080p screen without scrolling.','Single-key shortcuts for all tools (shown on the buttons), F to fit view, arrow keys nudge selected nodes.','Cursor coordinates and snap preview ring; autosave to the browser and restore on reopening.','Menu: New / clear canvas, Save / load as text, Keyboard shortcuts.']],
['1.12','Precision',['Variable UDL drawn with one scale per member so the load envelope stays straight and is no longer distorted by arrow-length capping.','Editable x / y node coordinates in the node popup (no snapping).']],
['1.11','Gradient',['Teal gridlines every 5 m with labels, kept absolute as you zoom.','Split element tool (2\u201325 equal elements; slider or member popup), including curved members.','Variable UDL tool: triangular and trapezoidal loads with exact element treatment; popup for start and end values.','Verification suite extended to 46 tests.']],
['1.10','Dashboard',['Instructions and load status moved to an info panel at the bottom right.','Finite-element status: converged or not, passes, element and DOF counts, equilibrium residual, pivot ratio, solve time and cable state.','Sign-convention and units legend under the grid scale.']],
['1.9','Selection',['Popup position and size fixed once shown, so it no longer jumps while editing loads.','Number boxes beside every slider, plus 0 buttons to zero a load.','Box selection, Shift-click multi-select, Ctrl+A.','Copy and paste (Ctrl+C / Ctrl+V, Duplicate button) into the nearest free area of the canvas.']],
['1.8','Proof',['Menu added with Verification tests: 41 closed-form checks (beams, cantilevers, continuous and Gerber beams, trusses, cables, arches, portal frames, equilibrium, Maxwell reciprocity, mechanism detection).','Method and assumptions dialog.']],
['1.7','Heritage',['Dark purple theme made the default.','Michell cantilever (fan layout) and MBB beam (Messerschmitt-B\u00f6lkow-Blohm) examples.']],
['1.6','Joints',['Rigid (solid dot) and hinged (open circle) joints, with Joints tools and a node popup selector.','Axial force: T/C diagram and tint, readout of Max |N|, axial force in the member popup.','Three-pinned arch, three-pinned portal and Gerber beam examples.']],
['1.5','Selector',['Select tool replaces Move and Delete: select nodes, members and kept loads, drag nodes, delete with the keyboard.','Popup with sliders for stiffness, curvature, loads and support type next to the selection.']],
['1.4','Arches',['Example structures dropdown (simply supported, cantilever, propped cantilever, continuous beam, portal, pitched portal, arch, cable stay) with a clear-canvas confirmation.','Curved (circular arc) members with a curve-rise slider.','Tension-only cables with active-set solution and slack detection.']],
['1.3','Lines',['Purple theme as the default.','Moment, shear and reaction displays scale with load using the same soft-saturating law as deflection.','Dynamic line grid that re-spaces as you zoom.']],
['1.2','Violet',['Moment load tool.','Tools moved to a left-hand panel; purple colour scheme.','Undo (Ctrl+Z), scroll zoom, right-drag pan, Fit view, light / dark toggle, hover highlight, rubber-band line and colour legend dots.']],
['1.1','Icons',['Deflected shape now grows gradually with load instead of snapping to a fixed maximum.','Separate support buttons (pin, roller, fixed, free) and icons on every tool.']],
['1.0','First Push',['First release: draw nodes and members, add pin, roller and fixed supports.','Point load and UDL tools to push and pull the structure interactively.','Live deflected shape, bending moment and shear diagrams and reaction arrows; relative member stiffness slider.']]];
function showAbout(){let h='<p style="margin:0 0 8px"><b>Frame Pusher</b> v'+VER+' "'+VNAME+'" \u00b7 build of 11 Nov 2026</p><p style="margin:0 0 8px;color:var(--mut)">An interactive 2D frame, beam, arch and cable-truss analyser. Draw a structure, add supports, then push and pull it with point, moment and distributed loads to see the deflected shape, bending moment, shear, axial force and reactions update live. Linear-elastic direct-stiffness analysis with Euler\u2013Bernoulli beam elements; see Method &amp; assumptions and Verification tests in the Menu. Runs entirely in your browser as a single static file with no external dependencies. Created with Claude (Anthropic) in an iterative design session.</p><p style="margin:0 0 4px;color:var(--mut);font-size:12px">Results are for exploration and teaching; they are not a substitute for a checked design calculation.</p><h4 style="margin:14px 0 2px;color:var(--acc)">Changelog</h4>';
 CHANGELOG.forEach(c=>{h+='<h5 style="margin:10px 0 2px;color:var(--acc)">v'+c[0]+' \u2013 '+c[1]+(c[0]==VER?' (current)':'')+'</h5><ul style="margin:0;padding-left:18px">'+c[2].map(x=>'<li>'+x+'</li>').join('')+'</ul>'});showV('About',h)}

/* ---------- surprising behaviour: nine side-by-side examples ---------- */
Object.assign(PRESETS,{
 sur_stiff:['Surprise: the stronger beam suffers more from settlement',()=>{
  const sb=e=>{const a=nn(0,0,'pin'),b=nn(6,0,'ry'),c=nn(12,0,'ry');mm(a,b,e);mm(b,c,e);b.sd=.02};
  side('Reference beam (EI 10 000 kNm²)',0,0,()=>sb(1));side('Four times as stiff (EI 40 000 kNm²)',16,0,()=>sb(4));
  capt('No load at all: the middle support of two 6 m spans settles 20 mm. You might expect the stronger beam to cope better, but settlement\nimposes a displacement, not a force, so the moment it causes is proportional to EI: 16.7 kNm over the support for the reference beam\nand 66.7 kNm for the stiffer one (3EIδ/L²). The middle support even pulls down on the beam, 5.6 and 22.2 kN. Flexible structures\nride out settlement; stiff ones crack.',3.4)}],
 sur_uplift:['Surprise: loading one span lifts the next and pulls on the far support',()=>{
  const a=nn(0,0,'pin'),b=nn(6,0,'ry'),c=nn(12,0,'ry');mm(a,b).w=-10;mm(b,c);
  capt('10 kN/m on the left span of a two-span beam only. The unloaded right span is not just left alone: the hogging moment over the middle\nsupport (22.5 kNm) bends it upward, lifting it by 5.2 mm at 2.54 m from B, and the far support has to hold the beam down with 3.75 kN\n(wL/16). A roller that cannot resist uplift would let the end lift off. Watch the reactions and the deflected shape.',3.4)}],
 sur_pattern:['Surprise: less load, more moment (pattern loading)',()=>{
  const cb=p=>{const n=[0,5,10,15].map((x,i)=>nn(x,0,i?'ry':'pin'));for(let i=0;i<3;i++){const m=mm(n[i],n[i+1]);if(p[i])m.w=-20}};
  side('All three spans loaded (300 kN)',0,0,()=>cb([1,1,1]));side('Only the outer spans loaded (200 kN)',19,0,()=>cb([1,0,1]));
  capt('Three 5 m spans, 20 kN/m. Take the load off the middle span and the sagging moment in the end spans rises from 40.0 to 50.6 kNm (27 % more\nwith a third less load) and their deflection from 8.6 to 12.4 mm, because the unloaded middle span no longer holds the ends of the outer\nspans down. The middle span even goes into hogging (−25 kNm). This is why design codes ask for spans to be loaded in patterns.',3.4)}],
 sur_shortcol:['Surprise: the short column takes almost all the sway',()=>{
  const a=nn(0,2,'fix'),b=nn(0,4),c=nn(8,4),d=nn(8,0,'fix');mm(a,b);mm(b,c,20);mm(d,c);ld(b,20,0);
  capt('A stiff beam on two identical fixed-base columns, one 2 m tall and one 4 m tall, pushed sideways with 20 kN. Both column tops move by\nthe same 1.34 mm, and a column’s sway stiffness grows as 1/h³, so the short column is about eight times as stiff and takes 17.4 kN of the\n20 kN (87 %) and 18.3 kNm at its base, against 2.6 kN and 5.2 kNm for the tall one. Short columns on sloping sites and stair cores are\nwhere frames crack first in earthquakes.',3.4)}],
 sur_gravsway:['Surprise: a vertical load makes the frame move sideways',()=>{
  const pf_=h1=>{const a=nn(0,0,'pin'),b=nn(0,h1),c=nn(6,h1),d=nn(6,h1-3,'pin');mm(a,b);mm(b,c).w=-10;mm(c,d)};
  side('Equal 3 m columns',0,0,()=>pf_(3));side('One column 6 m, the other 3 m',10,0,()=>pf_(6));
  capt('10 kN/m straight down on the beam, no sideways load at all. The symmetric frame only sags (its sway, 0.02 mm, is the columns\nshortening). Make one column longer and the same vertical load pushes the frame 9.4 mm sideways, towards the long column: the beam\nend moments need equal and opposite base thrusts (3.9 kN), and the long column is far more flexible in sway than the short one.',3.4)}],
 sur_zero:['Surprise: members that carry nothing (but are still needed)',()=>{
  PRESETS.pratt[1]();ld(nodes.find(n=>n.x==12&&n.y==0),0,-60);
  capt('A 24 m Pratt truss with 60 kN at the middle of the bottom chord. Tick Axial (T/C): three of the 21 members, the verticals at 4, 12\nand 20 m, carry exactly no force, because at their bottom joints the two chord members are in line and nothing else pulls across them.\nThey are not useless: take one away and the bottom joint can drop freely, so the truss becomes a mechanism (try Delete on one).\nUnder other loads they work, and in real trusses they also brace the chords against buckling.',3.4)}],
 sur_flatcable:['Surprise: the flatter the cable, the harder it pulls',()=>{
  const cv=f=>{const a=nn(0,f,'pin'),b=nn(8,f,'pin'),c=nn(4,0);mm(a,c,1,'cable');mm(b,c,1,'cable');ld(c,0,-10)};

  const ob=P=>{const a=nn(0,0,'pin'),b=nn(6,0,'ry'),c=nn(8,0),m1=mm(a,b);mm(b,c);m1.w=-10;if(P)ld(c,0,-P)};

 sur_hinge:['Surprise: two hinges that change nothing',()=>{
  const xc=3*(1-1/Math.sqrt(3)),fb=h=>{const a=nn(0,0,'fix'),p=nn(xc,0),q=nn(6-xc,0),b=nn(6,0,'fix');[mm(a,p),mm(p,q),mm(q,b)].forEach(m=>m.w=-10);if(h)p.hinge=q.hinge=true};
  side('Fixed-ended beam',0,0,()=>fb(false));side('With hinges at the points of contraflexure',9,0,()=>fb(true));
  capt('A 6 m beam built in at both ends under 10 kN/m bends with zero moment at 1.27 m from each end (L/2 · (1 − 1/√3)). Put hinges exactly\nthere and nothing changes: the moments (30 kNm at the ends, 15 kNm at mid-span) and the 3.4 mm deflection are identical, because a hinge\nonly releases a moment that is already zero. The hinged beam is now statically determinate – the idea behind Gerber beams, which put\ntheir hinges near the points of contraflexure. Move a hinge (select it and drag) and the moments redistribute.',3.4)}]});
